<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" role="img" aria-label="Illustration of the Soferio Reader PDF tool" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8eeff"/><stop offset="1" stop-color="#dff7f3"/></linearGradient>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1e2a55" flood-opacity=".18"/></filter>
  </defs>
  <rect width="560" height="400" rx="28" fill="url(#bg)"/>
  <g filter="url(#s)">
    <rect x="50" y="44" width="460" height="312" rx="16" fill="#fff"/>
  </g>
  <rect x="50" y="44" width="460" height="40" rx="16" fill="#f3f5fb"/>
  <rect x="50" y="68" width="460" height="16" fill="#f3f5fb"/>
  <circle cx="74" cy="64" r="6" fill="#ff6b6b"/><circle cx="94" cy="64" r="6" fill="#ffc542"/><circle cx="114" cy="64" r="6" fill="#3ddc97"/>
  <rect x="200" y="56" width="160" height="16" rx="8" fill="#e2e7f3"/>
  <!-- sidebar thumbnails -->
  <rect x="66" y="100" width="70" height="240" rx="10" fill="#f6f8fc"/>
  <rect x="78" y="112" width="46" height="60" rx="4" fill="#fff" stroke="#4f7cff" stroke-width="2.5"/>
  <rect x="78" y="182" width="46" height="60" rx="4" fill="#fff" stroke="#dde3f0" stroke-width="1.5"/>
  <rect x="78" y="252" width="46" height="60" rx="4" fill="#fff" stroke="#dde3f0" stroke-width="1.5"/>
  <!-- page -->
  <rect x="156" y="100" width="230" height="240" rx="8" fill="#fff" stroke="#e5e9f2" stroke-width="1.5"/>
  <rect x="176" y="120" width="120" height="12" rx="6" fill="#1e2a55"/>
  <g fill="#cfd6e6">
    <rect x="176" y="146" width="190" height="7" rx="3.5"/>
    <rect x="176" y="160" width="176" height="7" rx="3.5"/>
    <rect x="176" y="200" width="190" height="7" rx="3.5"/>
    <rect x="176" y="214" width="150" height="7" rx="3.5"/>
    <rect x="176" y="228" width="182" height="7" rx="3.5"/>
    <rect x="176" y="270" width="190" height="7" rx="3.5"/>
    <rect x="176" y="284" width="120" height="7" rx="3.5"/>
    <rect x="176" y="310" width="170" height="7" rx="3.5"/>
  </g>
  <rect x="172" y="170" width="170" height="13" rx="3" fill="#ffe27a" opacity=".85"/>
  <rect x="176" y="173" width="160" height="7" rx="3.5" fill="#8a7a2a" opacity=".55"/>
  <!-- Get Link selection box with orange flash -->
  <rect x="168" y="194" width="206" height="48" rx="6" fill="#ff8a1f" opacity=".14"/>
  <rect x="168" y="194" width="206" height="48" rx="6" fill="none" stroke="#ff8a1f" stroke-width="2.5" stroke-dasharray="7 5"/>
  <g transform="translate(300 180)">
    <rect width="78" height="24" rx="12" fill="#ff8a1f"/>
    <text x="39" y="16.5" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" font-size="11.5" fill="#fff" text-anchor="middle">Get Link</text>
  </g>
  <!-- notes panel -->
  <rect x="402" y="100" width="92" height="240" rx="10" fill="#f6f8fc"/>
  <text x="414" y="122" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" font-size="12" fill="#1e2a55">Notes</text>
  <rect x="414" y="134" width="68" height="6" rx="3" fill="#cfd6e6"/>
  <rect x="414" y="146" width="52" height="6" rx="3" fill="#cfd6e6"/>
  <g transform="translate(410 164)">
    <rect width="78" height="30" rx="8" fill="#e8eeff" stroke="#4f7cff" stroke-width="1.5"/>
    <path d="M12 15h6M10.5 12.5a3 3 0 0 0 0 5h2M19.5 12.5a3 3 0 0 1 0 5h-2" fill="none" stroke="#4f7cff" stroke-width="1.8" stroke-linecap="round"/>
    <text x="48" y="19" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" font-size="10" fill="#2f56d6" text-anchor="middle">clause 2</text>
  </g>
  <rect x="414" y="206" width="64" height="6" rx="3" fill="#cfd6e6"/>
  <rect x="414" y="218" width="44" height="6" rx="3" fill="#cfd6e6"/>
  <!-- curved arrow from link back to page -->
  <path d="M410 180 C 395 182, 388 205, 378 214" fill="none" stroke="#ff8a1f" stroke-width="2.2" stroke-dasharray="4 4"/>
  <path d="M384 212 L377 216 L379 208" fill="none" stroke="#ff8a1f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- PDF badge -->
  <g transform="translate(420 268)">
    <rect width="60" height="56" rx="12" fill="#4f7cff"/>
    <text x="30" y="35" font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" font-size="17" fill="#fff" text-anchor="middle">PDF</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
