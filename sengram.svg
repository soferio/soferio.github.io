<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" role="img" aria-label="Illustration of a SenGram sentence diagram puzzle" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1e6"/><stop offset="1" stop-color="#f1e9ff"/></linearGradient>
    <filter id="s2" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#3b1e55" flood-opacity=".18"/></filter>
  </defs>
  <rect width="560" height="400" rx="28" fill="url(#bg2)"/>
  <!-- tablet -->
  <g filter="url(#s2)"><rect x="60" y="40" width="440" height="320" rx="30" fill="#1f1b2e"/></g>
  <rect x="76" y="56" width="408" height="288" rx="18" fill="#fffdf8"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#1f1b2e">
    <!-- baseline -->
    <line x1="110" y1="180" x2="450" y2="180" stroke="#1f1b2e" stroke-width="3" stroke-linecap="round"/>
    <!-- subject/verb divider crosses baseline -->
    <line x1="220" y1="140" x2="220" y2="200" stroke="#1f1b2e" stroke-width="3" stroke-linecap="round"/>
    <!-- verb/object divider -->
    <line x1="330" y1="146" x2="330" y2="180" stroke="#1f1b2e" stroke-width="3" stroke-linecap="round"/>
    <text x="165" y="170" font-size="24" text-anchor="middle">players</text>
    <text x="275" y="170" font-size="24" text-anchor="middle">solve</text>
    <text x="390" y="170" font-size="24" text-anchor="middle">puzzles</text>
    <!-- modifiers -->
    <line x1="150" y1="180" x2="190" y2="250" stroke="#1f1b2e" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="370" y1="180" x2="410" y2="250" stroke="#1f1b2e" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- draggable tiles -->
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" font-size="17" text-anchor="middle">
    </g><text transform="rotate(60.3 160 190)" x="168" y="185" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#ff6a2c">clever</text><g font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" font-size="17" text-anchor="middle">
    <rect x="370" y="270" width="86" height="34" rx="9" fill="#8b5cf6"/><text x="413" y="293" fill="#fff">tricky</text>
    <path d="M412 266 C 404 250, 398 240, 396 226" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-dasharray="5 5"/>
    <path d="M392 232 L396 222 L402 231" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- header -->
  <rect x="100" y="76" width="110" height="26" rx="13" fill="#f1e9ff"/>
  <text x="155" y="94" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#6d3fd6" text-anchor="middle">Level 2</text>
  <g transform="translate(400 89)">
    <circle cx="0" cy="0" r="9" fill="#ffc542"/><circle cx="24" cy="0" r="9" fill="#ffc542"/><circle cx="48" cy="0" r="9" fill="#e8e3d8"/>
  </g>
  <rect x="100" y="314" width="150" height="10" rx="5" fill="#eee8dc"/>
  <rect x="100" y="314" width="96" height="10" rx="5" fill="#3ddc97"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
